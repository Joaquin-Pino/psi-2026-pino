services:
  demo:
    build:
      context: .
      target: runtime
    image: psi-lab:runtime
    volumes:
      - ./out:/out

  test:
    build: 
      context: .
      target: dev
    image: psi-lab:dev
  notebook:
    build:
      context: .
      target: notebook
    image: psi-lab:notebook
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
